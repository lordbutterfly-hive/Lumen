[project]
name = "recsys"
version = "0.0.1"
description = "Hive blog discovery/ranking backend (Phase 0)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
io = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ★ `recsys.service` added 2026-08-05. It was omitted while the Dockerfile
# copies raw source, so the gap was latent — but an installed wheel/sdist
# would have shipped without the HTTP service entirely, i.e. `python -m
# recsys.service.app` (the container's own CMD) would fail on a real install.
packages = [
    "recsys",
    "recsys.core",
    "recsys.io",
    "recsys.db",
    "recsys.jobs",
    "recsys.service",
]

# C5 (2026-08-04): recsys/data/trusted_seeds.txt is read at runtime via
# importlib.resources (recsys.config._load_trusted_seeds), not a path relative
# to a source file, so it must be declared as package data or it silently
# vanishes from an installed wheel/sdist while still working from a repo
# checkout — exactly the packaging trap importlib.resources exists to avoid.
# `recsys.data` is a plain data directory (no __init__.py, not itself in
# `packages` above); setuptools still ships glob-matched files under a listed
# package's own directory tree, so no separate package entry is needed for it.
[tool.setuptools.package-data]
recsys = ["data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# The measurement harness must set sys.path BEFORE importing `recsys`, so its
# imports are necessarily module-level-but-not-top (E402). That is inherent to a
# harness that binds to the tree it sits in; the alternative is requiring
# PYTHONPATH by hand, which is the defect this replaced. Scoped to the harness
# only — the package itself stays fully linted.
#
# ★★★ E3 (2026-08-05) — `ruff check .` IS NOW THE GATE, AND IT PASSES.
#
# Until today the quoted "ruff clean" headline was `ruff check recsys/ tests/`,
# which silently EXCLUDED `measurement-harness/` — the evidence base for every
# ranking claim this project makes. Run repo-wide it reported 63 errors. All of
# them are now fixed except line length: the compound statements (E702, 23 of
# them) were split and the one lambda assignment (E731) became a def, and EVERY
# panel touched was re-run and proved BYTE-IDENTICAL afterwards, so the cleanup
# moved no measurement.
#
# E501 is exempted for the harness ONLY, deliberately and visibly rather than by
# narrowing the command: these files print fixed-width comparison tables, so
# their f-strings and header rulers are legitimately wide, and reflowing them
# would hurt readability of the thing an operator actually reads. NO CORRECTNESS
# RULE IS SUPPRESSED — F (bugs), I (imports), UP, B, SIM and RUF all apply to
# the harness and are clean.
[tool.ruff.lint.per-file-ignores]
"measurement-harness/*.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
# ★ The live-mirror suite (tests/test_hafsql_live.py). Registered so the marker
# is a real selector (`pytest -m live`) rather than an unknown-mark warning.
# It is SKIPPED unless RECSYS_LIVE_DB is set, so an offline run — CI included —
# stays green and network-free. It exists because eight hard I/O breaks
# survived every gate: the offline hafsql tests assert that SQL strings are
# non-empty and never execute one against a schema.
markers = [
    "live: hits the real public HAFSQL mirror; requires RECSYS_LIVE_DB=1",
]
