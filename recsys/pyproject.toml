[project]
name = "recsys"
version = "0.0.1"
description = "Hive blog discovery/ranking backend (Phase 0)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
io = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recsys", "recsys.core", "recsys.io"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# The measurement harness must set sys.path BEFORE importing `recsys`, so its
# imports are necessarily module-level-but-not-top (E402). That is inherent to a
# harness that binds to the tree it sits in; the alternative is requiring
# PYTHONPATH by hand, which is the defect this replaced. Scoped to the harness
# only — the package itself stays fully linted.
[tool.ruff.lint.per-file-ignores]
"measurement-harness/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
