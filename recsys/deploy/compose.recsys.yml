# A10/A7 deploy artifact — recsys serving + trust-batch, in the frontend's
# existing Compose stack shape (`../../frontend/stack/compose.*.yml`:
# `profiles:`, `networks: docker`, a `wget --spider` healthcheck, env vars
# read from the environment rather than hardcoded). Include this file from
# the frontend's own `compose.yml` the same way it already includes
# `compose.auth.yml`/`compose.blog.yml`/etc., or run it standalone with
# `docker compose -f deploy/compose.recsys.yml up`.
#
# Image: build from `../Dockerfile` (`docker build -t recsys:latest ..`ready
# via the `build:` block below) — one image, two roles (see that file's own
# header comment): `recsys-feed` runs it as the continuous HTTP service
# (A10); `recsys-trust-batch` runs the SAME image with its CMD overridden to
# the weekly batch (A7).
#
# 🚩 SCHEDULING THE BATCH IS AN OPERATOR DECISION, DELIBERATELY NOT MADE
# HERE (BUILDMAP-A A7's own "not a Sonnet unit end-to-end" flag). This file
# makes `recsys-trust-batch` a RUNNABLE one-shot service
# (`docker compose run --rm recsys-trust-batch`) but does not wire a
# scheduler — no cron sidecar, no `profiles`-gated always-on loop. Pick one:
#   * host cron -> `docker compose -f deploy/compose.recsys.yml run --rm recsys-trust-batch`
#   * a scheduler container (e.g. `ofelia`) pointed at this same service
#   * a k8s CronJob running this same image with the same CMD override
# if this stack is ever migrated off Compose entirely.

services:
  recsys-feed:
    build:
      context: ..
      dockerfile: Dockerfile
    image: recsys:${RECSYS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # ★ ADDED 2026-08-23. `recsys/core/banned.py` reads this and unions it with the
      # shipped `data/banned_authors.txt`, but it was declared in NO service here — so no
      # container could ever supply it, and the operator's only lever for an urgent ban
      # was a rebuild. That is the fifth instance of the defect this file already names
      # four times: config that exists in code and not in the artifact is config that
      # does not exist. Declared on all three services because `banned_authors()` is read
      # on BOTH paths — request-time scoring and the trust-snapshot build — and each
      # process holds its own `@lru_cache`, so setting it on one would just relocate the
      # divergence.
      RECSYS_BANNED_AUTHORS:
      # Public, read-only HAFSQL mirror (recsys/config.py:HafsqlConfig
      # defaults — override only to point at a different mirror/replica).
      HAFSQL_HOST:
      HAFSQL_PORT:
      HAFSQL_DB:
      HAFSQL_USER:
      HAFSQL_PASSWORD:
      HAFSQL_STATEMENT_TIMEOUT_MS:
      HAFSQL_POOL_MIN:
      HAFSQL_POOL_MAX:
      # recsys's OWN Postgres (A6/A15) — trust snapshots, network suppression.
      # REQUIRED for a real deployment: absent, the service starts (a missing
      # snapshot is a legitimate cold-start state) but /feed refuses every
      # request under FAIL_CLOSED until this is set AND a batch has run.
      RECSYS_DATABASE_URL:
      # Lumen Lite (A13) — off until an operator names the publisher account(s).
      LITE_PUBLISHER_ACCOUNTS:
      LITE_FRONTEND_ACCOUNT_MAINNET:
      LITE_FRONTEND_ACCOUNT_MIRRORNET:
      LITE_FRONTEND_ACCOUNT_TESTNET:
      # ★★ L2 (2026-08-05, round-3 council): the lite ENGAGEMENT datastore —
      # the Lumen app's own Postgres (`LITE_DATABASE_URL` on the frontend
      # side), a THIRD database distinct from the HAFSQL mirror and the recsys
      # DB. Absent, lite votes and reblogs are simply not read: the four
      # publisher vars above were passed and this one was not, so lite POSTS
      # were sourced while lite ENGAGEMENT was silently inert.
      LUMEN_LITE_DATABASE_URL:
      # This service's own tuning (recsys/service/app.py:ServiceConfig).
      # RECSYS_SERVICE_HOST/PORT are the CONTAINER-INTERNAL bind address —
      # deliberately FIXED, never templated from the host-facing port below.
      # (Found running this file: templating both from the same operator
      # variable means changing "which host port to publish on" also changes
      # what the app listens on INSIDE the container, breaking the `ports:`
      # mapping the moment an operator overrides it — reproduced live: the
      # app ended up listening on the host port instead of 8000, and the
      # container:8000 side of the mapping had nothing behind it, so every
      # request got a connection reset. Publish on a different HOST port via
      # `RECSYS_HOST_PORT` instead, below — the container side never moves.)
      RECSYS_SERVICE_HOST: "0.0.0.0"
      RECSYS_SERVICE_PORT: "8000"
      RECSYS_NORM_REFRESH_S:
      RECSYS_SNAPSHOT_REFRESH_S:
      RECSYS_VIEWER_CACHE_TTL_S:
      # ★★★ 2026-08-06 — FIVE MORE INSTANCES OF THE SAME DEFECT, found by
      # replacing the per-variable assertions in `test_deploy_artifact.py` with a
      # SWEEP over everything `app.py` reads. `RECSYS_TRUSTED_PROXY_HOPS` and
      # `LUMEN_LITE_DATABASE_URL` were each caught one at a time, a round apart;
      # nobody asked the general question, and these five had been unreachable
      # the whole time.
      #
      # None is a security control — they are tuning knobs with working defaults
      # — but the author-prior warm build was live-measured at 508s against the
      # real mirror, and an operator could not change its size or cadence
      # without editing the image. Config that exists in code and not in the
      # artifact is config that does not exist.
      RECSYS_VIEWER_CACHE_MAX_ENTRIES:
      RECSYS_AUTHOR_PRIOR_REFRESH_S:
      RECSYS_AUTHOR_PRIOR_DISCOVERY_DAYS:
      RECSYS_AUTHOR_PRIOR_DISCOVERY_LIMIT:
      RECSYS_AUTHOR_PRIOR_CHUNK_SIZE:
      RECSYS_LOG_LEVEL:
      # ★★★ REQUIRED — WITHOUT THIS THE CONTAINER CRASH-LOOPS (fixed 2026-08-05).
      # `main()` calls `Settings.from_env(production=True)` unless
      # RECSYS_PRODUCTION=0, and that REFUSES to start with no seat secret. This
      # file previously did not mention the variable at all, so the shipped
      # artifact could not boot under `restart: unless-stopped` — reproduced by
      # running it. The blank value is a PASS-THROUGH from the operator's
      # environment/.env; it is deliberately not defaulted, because a default
      # would silently reinstate the publicly-known dev key in production.
      #
      # Generate one: `python -c "import secrets; print(secrets.token_hex(32))"`
      # (64 hex chars = 32 bytes).
      #
      # The seat MAC stops offline NAME GRINDING of the reserved new-author
      # slot — unkeyed, 6 ground names took 85% of that seat platform-wide.
      LUMEN_EXPLORE_SEAT_SECRET:
      # Optional rollover pair. Set PREVIOUS to the outgoing secret and
      # ACTIVE_FROM_BUCKET to a FUTURE bucket so in-flight pages do not reroll
      # mid-rotation; see ExplorationConfig.from_env for the contract.
      LUMEN_EXPLORE_SEAT_SECRET_PREVIOUS:
      LUMEN_EXPLORE_SEAT_SECRET_ACTIVE_FROM_BUCKET:
      # ★★★ ALSO REQUIRED IN PRODUCTION (B4c, 2026-08-05). /feed returns any
      # account's ranked feed plus the full score decomposition, in front of a
      # pool pointed at a SHARED third-party mirror — an open instance is both a
      # data-exposure and an abuse-amplification problem for someone else's
      # database. `main()` refuses to start without this unless
      # RECSYS_PRODUCTION=0. Generate:
      # `python -c "import secrets; print(secrets.token_urlsafe(32))"`
      # Callers send it as `Authorization: Bearer <token>`. /health stays open
      # so container healthchecks and load balancers keep working.
      RECSYS_API_TOKEN:
      # Optional throttles; these have working defaults (120/min, 16 in flight,
      # 10s read timeout) and are listed so an operator can find them.
      # ★★★ ROUND-5 COUNCIL (Seat 1). `RECSYS_TRUSTED_PROXY_HOPS` existed in
      # `ServiceConfig` and reached NO container — the identical defect the
      # round-4 council found for `LUMEN_LITE_DATABASE_URL`, repeated one round
      # later by the same author. Config that exists in code and not in the
      # artifact is config that does not exist.
      #
      # Unset/0 = no proxy in front, `X-Forwarded-For` IGNORED (the safe
      # default). Set it to the number of proxies YOU run: behind the reverse
      # proxy this stack documents, leaving it unset means one unauthenticated
      # client spends the shared rate-limit bucket and 429s every real user.
      RECSYS_TRUSTED_PROXY_HOPS:
      # ★★★ B10 (2026-08-06 QA) — REQUIRED WHENEVER HOPS > 0, and the service
      # REFUSES TO START without it. Declaring how many proxies you run is not
      # declaring WHO they are: the hops fix above trusted `X-Forwarded-For` on
      # the strength of a number, so anything that could reach port 8000
      # directly — a sibling container on this very network — forged the whole
      # chain and minted an unlimited number of rate-limit buckets.
      #
      # Comma-separated IPs or CIDRs, matched against the PEER address (the one
      # the kernel reports; no header can change it). For a proxy container on
      # this compose network that is the Docker bridge subnet — find it with
      #   docker network inspect <project>_default -f '{{(index .IPAM.Config 0).Subnet}}'
      # e.g. RECSYS_TRUSTED_PROXY_PEERS=172.18.0.0/16
      RECSYS_TRUSTED_PROXY_PEERS:
      RECSYS_RATE_LIMIT_PER_MINUTE:
      RECSYS_MAX_CONCURRENT_REQUESTS:
      RECSYS_REQUEST_READ_TIMEOUT_S:
      # Bounds how long `borrow()` waits for a pool slot before returning 503
      # instead of opening an unbounded connection (B4b).
      HAFSQL_POOL_ACQUIRE_TIMEOUT_S:
      # `0` opts out of the production fail-shut for LOCAL runs only. Unset
      # means production, which is the safe default and what this file assumes.
      RECSYS_PRODUCTION:
    # ★★★ ROUND-5 COUNCIL (Seat 1) — WITHOUT THIS, A COLD DEPLOY IS UNHEALTHY
    # FOREVER. `/feed` refuses to serve without a trust snapshot, the probe
    # gates on `serving`, and the batch below was documented as "an operator
    # decision" and left unscheduled — so `up` produced a container that could
    # never pass its own healthcheck. Renaming the health JSON's reason (which
    # is what the punch list first did) did not change that by one bit.
    #
    # The batch now runs to completion BEFORE the service starts, so a fresh
    # install comes up serving. It stays a one-shot: this is the FIRST snapshot,
    # not a schedule. Recurring runs are still the operator's to wire (see the
    # header) — but "it never works until you read the docs" is not a deploy.
    depends_on:
      recsys-trust-batch:
        condition: service_completed_successfully
    ports:
      - "${RECSYS_HOST_PORT:-8000}:8000"
    networks:
      - docker
    # ★★ 2026-08-05 POST-CLOSEOUT COUNCIL. Was `wget --spider`, which (a) is not
    # in the `python:3.11-slim` image at all, (b) sends HEAD to a GET-only
    # handler, and (c) read only the status line, so it reported HEALTHY during
    # a total serving outage — `/health` returns 200 by design even when it
    # cannot serve. The probe now reads `serving` from the body. Full autopsy in
    # `recsys/service/healthcheck.py`. Keep this in step with the Dockerfile's
    # own HEALTHCHECK: two probes that disagree are worse than one.
    healthcheck:
      test: ["CMD", "python3", "-m", "recsys.service.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      # ★★★ RE-MEASURED 2026-08-06 BY ACTUALLY COLD-STARTING IT: 1242s (20.7
      # min), not the ~232s this line was set from. That figure covered the
      # NormContext warm only; the AUTHOR-PRIOR warm (2,237 authors, chunked
      # `author_engagement` against the shared mirror) is the real cost and runs
      # BEFORE the port opens at all.
      #
      # At 300s Docker marks the container unhealthy ~4x before it can serve,
      # and a restart policy then loops it forever — it never finishes warming,
      # so it never becomes healthy. Set from the measurement with headroom.
      # Cut the warm cost with RECSYS_AUTHOR_PRIOR_DISCOVERY_DAYS/_LIMIT if a
      # faster start matters more than a full warm set.
      start_period: 1800s

  # One-shot: `docker compose -f deploy/compose.recsys.yml run --rm recsys-trust-batch`.
  # Never started by `up` on its own — no `restart:` policy, and deliberately
  # not part of the default service set an operator gets by running `up` with
  # no arguments (Compose still starts it under plain `up` unless a profile
  # gates it out; add `profiles: ["batch"]` here if the stack this joins
  # already uses profiles the way `frontend/stack/*.yml` does, and gate
  # accordingly — left unset here so this file works standalone too).
  recsys-trust-batch:
    build:
      context: ..
      dockerfile: Dockerfile
    image: recsys:${RECSYS_IMAGE_TAG:-latest}
    command: ["python", "-m", "recsys.jobs.trust_batch"]
    environment:
      # ★ ADDED 2026-08-23. `recsys/core/banned.py` reads this and unions it with the
      # shipped `data/banned_authors.txt`, but it was declared in NO service here — so no
      # container could ever supply it, and the operator's only lever for an urgent ban
      # was a rebuild. That is the fifth instance of the defect this file already names
      # four times: config that exists in code and not in the artifact is config that
      # does not exist. Declared on all three services because `banned_authors()` is read
      # on BOTH paths — request-time scoring and the trust-snapshot build — and each
      # process holds its own `@lru_cache`, so setting it on one would just relocate the
      # divergence.
      RECSYS_BANNED_AUTHORS:
      HAFSQL_HOST:
      HAFSQL_PORT:
      HAFSQL_DB:
      HAFSQL_USER:
      HAFSQL_PASSWORD:
      # ★★★ 2026-08-06 — WITHOUT THIS THE BATCH CANNOT COMPLETE. Found by
      # running it against the real mirror: `engagement_edges` over the 365-day
      # `trust_days` window is cancelled by the DEFAULT 15s statement timeout
      # (`psycopg.errors.QueryCanceled`), so the batch dies and no trust
      # snapshot is ever written — which means /feed FAIL_CLOSEs on every
      # request forever.
      #
      # 15s is a REQUEST-path default and correct there. This is a weekly
      # background job; a statement that runs for minutes is exactly what it is
      # for. Set generously (e.g. 600000) for the batch only.
      #
      # This is the FOURTH instance of "config exists in code and reaches no
      # container" on this project (after LUMEN_LITE_DATABASE_URL,
      # RECSYS_TRUSTED_PROXY_HOPS and the AUTHOR_PRIOR family) — the variable
      # was passed to the feed service and to neither batch.
      HAFSQL_STATEMENT_TIMEOUT_MS:
      HAFSQL_POOL_MIN:
      HAFSQL_POOL_MAX:
      RECSYS_DATABASE_URL:
      RECSYS_LOG_LEVEL:
      # ★ REQUIRED for the same reason as the service above: `trust_batch`'s
      # own entry point calls `Settings.from_env(production=not args.dry_run)`,
      # so a real (non-dry-run) batch dies on an uncaught ValueError without
      # this. Found 2026-08-05 running the shipped artifact.
      LUMEN_EXPLORE_SEAT_SECRET:
      LUMEN_EXPLORE_SEAT_SECRET_PREVIOUS:
      LUMEN_EXPLORE_SEAT_SECRET_ACTIVE_FROM_BUCKET:
      # ★★★ REQUIRED FOR L1 (2026-08-05, round-3 council). `run_batch` is the
      # ONLY production caller of `engagement_edges`, so these four decide
      # whether a lite writer accrues their own graph-cred or donates it to the
      # shared publisher account. Passed to the SERVICE and not to the BATCH,
      # they would do nothing at all — the trust graph is built here.
      LITE_PUBLISHER_ACCOUNTS:
      LITE_FRONTEND_ACCOUNT_MAINNET:
      LITE_FRONTEND_ACCOUNT_MIRRORNET:
      LITE_FRONTEND_ACCOUNT_TESTNET:
    networks:
      - docker

  # ★★★ 2026-08-06 — WITHOUT THIS, THE WHOLE SERVICE 503s ON DAY 14.
  #
  # `recsys-trust-batch` above is a ONE-SHOT: it runs once before the service
  # starts (that is the cold-deploy fix) and is never run again. Meanwhile
  # `TrustConfig.max_snapshot_age_days = 14` and `/feed` is FAIL_CLOSED, so the
  # snapshot ages out two weeks after deploy and **every feed request refuses**.
  # Not degrades — refuses. The batch cadence was documented as "an operator
  # decision", which is the same shape as every other control this project left
  # optional and nobody set (the seat secret, the API token, the lite DSN, the
  # proxy peers). A deployment that is guaranteed to break on a known date is
  # not an operator preference; it is a missing part of the artifact.
  #
  # Deliberately a `sleep` loop and not cron: the image is `python:3.11-slim`
  # with no cron daemon (the same "the binary is not in the image" mistake that
  # shipped a `wget` healthcheck into an image without wget), and this needs no
  # new dependency, no new base image and no host-level scheduling.
  #
  # It sleeps FIRST so it does not duplicate the one-shot that just ran, and it
  # retries in an hour rather than a week if a run fails — a failed batch must
  # not silently consume the entire freshness budget waiting for the next tick.
  recsys-trust-batch-cron:
    build:
      context: ..
      dockerfile: Dockerfile
    image: recsys:${RECSYS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      recsys-trust-batch:
        condition: service_completed_successfully
    # RECSYS_TRUST_BATCH_INTERVAL_S must stay STRICTLY BELOW
    # `max_snapshot_age_days` in seconds (14d = 1209600). 3 days leaves four
    # whole cycles of headroom, so one failed run cannot age the snapshot out.
    # `tests/test_deploy_artifact.py` enforces that relationship mechanically —
    # raise this and the gate fails.
    #
    # ★★★ 3 DAYS SINCE 2026-08-15, AND THIS FILE IS NOT THE ONE THAT RUNS.
    # The deployed cron was launched by `deploy/trust-cron-host.sh` (the box is
    # not compose-managed; see that file's header). This default therefore
    # governs only a future compose deploy — which is exactly what makes it
    # dangerous to leave behind: the artifact test parses THIS FILE, so a
    # cadence changed here and not there (or there and not here) leaves the gate
    # pinning a number nobody runs. `test_the_two_schedulers_carry_the_same
    # _cadence` now refuses that split, in both directions.
    #
    # The reasoning for 3 rather than 2 or 7 — what it buys a new author, the
    # 2.33x mirror load against a source that fails off a planner cliff, and the
    # 2.33x faster arrival of the still-open rival-suppression bug — is written
    # out once, in `deploy/trust-cron-host.sh`'s header, rather than copied.
    command:
      - sh
      - -c
      # ★★★ EVERY `$` IN THIS BLOCK IS `$$`, AND THE SINGLE `$` VERSION SHIPPED A
      # TIGHT LOOP AGAINST A FREE PUBLIC DATABASE (found 2026-08-17 by running
      # `docker compose config`, which prints what the container ACTUALLY gets).
      #
      # Compose interpolates `$VAR` and `${VAR}` inside `command:` from the HOST
      # environment, at config time — before the container, and therefore before
      # the `environment:` block below has given these variables any value. So a
      # single `$` here does not reach the shell at all. What the container got:
      #
      #     sleep ""                     <- $NEXT_SLEEP_S, eaten
      #     if [ "" -ge 2 ]              <- $FAILURES, eaten
      #     echo "...(consecutive=)..."  <- the alert lost its count
      #
      # `sleep ""` is not a long sleep, it is an ERROR that returns immediately,
      # so `while true` becomes a TIGHT LOOP re-running the whole trust batch
      # back-to-back, forever, against `hafsql-sql.mahdiyari.info` — a free,
      # community-run mirror that this entire ranker depends on and that we do
      # not own. The failure mode is not a slow scheduler; it is hammering a
      # volunteer's database until we are rate-limited or blocked, and taking
      # `/feed` down with it when we are.
      #
      # `$$` is Compose's escape for a literal `$`, so the shell receives the
      # variable reference and resolves it at RUNTIME from the container's own
      # environment — which is where these values actually live.
      #
      # ★ HOW TO VERIFY, AND THE TRAP IN VERIFYING IT. `docker compose config` is
      # NOT the check: its output is itself valid Compose input, so it re-escapes
      # a literal `$` back to `$$` and prints `sleep "$$NEXT_SLEEP_S"` for the
      # CORRECT file. Reading that as "still broken" and re-fixing it would take
      # you straight back to the tight loop. `config` only tells you about the
      # BROKEN form, which collapses to a visibly empty `sleep ""`.
      #
      # The real check runs a container and asks the shell what it got:
      #
      #     docker compose -f compose.recsys.yml run --rm --entrypoint sh \
      #       recsys-trust-batch-cron -c 'echo "[$RECSYS_TRUST_BATCH_INTERVAL_S]"'
      #
      # Measured 2026-08-17 on a two-service busybox file, both forms side by
      # side: single `$` printed `[]`, double `$$` printed `[259200]`.
      - |
        NEXT_SLEEP_S="$${RECSYS_TRUST_BATCH_INTERVAL_S:-259200}"
        FAILURES=0
        while true; do
          sleep "$$NEXT_SLEEP_S"
          echo "trust_batch: starting scheduled run"
          if python -m recsys.jobs.trust_batch; then
            echo "trust_batch: scheduled run OK"
            FAILURES=0
            NEXT_SLEEP_S="$${RECSYS_TRUST_BATCH_INTERVAL_S:-259200}"
          else
            FAILURES=$$((FAILURES + 1))
            echo "trust_batch: scheduled run FAILED (consecutive=$$FAILURES) — retrying in $${RECSYS_TRUST_BATCH_RETRY_S:-3600}s"
            if [ "$$FAILURES" -ge 2 ]; then
              echo "TRUST_BATCH_ALERT: $$FAILURES consecutive failures; the snapshot is aging toward max_snapshot_age_days and /feed will FAIL_CLOSE when it expires"
            fi
            NEXT_SLEEP_S="$${RECSYS_TRUST_BATCH_RETRY_S:-3600}"
          fi
        done
    environment:
      # ★ ADDED 2026-08-23. `recsys/core/banned.py` reads this and unions it with the
      # shipped `data/banned_authors.txt`, but it was declared in NO service here — so no
      # container could ever supply it, and the operator's only lever for an urgent ban
      # was a rebuild. That is the fifth instance of the defect this file already names
      # four times: config that exists in code and not in the artifact is config that
      # does not exist. Declared on all three services because `banned_authors()` is read
      # on BOTH paths — request-time scoring and the trust-snapshot build — and each
      # process holds its own `@lru_cache`, so setting it on one would just relocate the
      # divergence.
      RECSYS_BANNED_AUTHORS:
      HAFSQL_HOST:
      HAFSQL_PORT:
      HAFSQL_DB:
      HAFSQL_USER:
      HAFSQL_PASSWORD:
      # ★★★ 2026-08-06 — WITHOUT THIS THE BATCH CANNOT COMPLETE. Found by
      # running it against the real mirror: `engagement_edges` over the 365-day
      # `trust_days` window is cancelled by the DEFAULT 15s statement timeout
      # (`psycopg.errors.QueryCanceled`), so the batch dies and no trust
      # snapshot is ever written — which means /feed FAIL_CLOSEs on every
      # request forever.
      #
      # 15s is a REQUEST-path default and correct there. This is a weekly
      # background job; a statement that runs for minutes is exactly what it is
      # for. Set generously (e.g. 600000) for the batch only.
      #
      # This is the FOURTH instance of "config exists in code and reaches no
      # container" on this project (after LUMEN_LITE_DATABASE_URL,
      # RECSYS_TRUSTED_PROXY_HOPS and the AUTHOR_PRIOR family) — the variable
      # was passed to the feed service and to neither batch.
      HAFSQL_STATEMENT_TIMEOUT_MS:
      HAFSQL_POOL_MIN:
      HAFSQL_POOL_MAX:
      RECSYS_DATABASE_URL:
      RECSYS_LOG_LEVEL:
      RECSYS_TRUST_BATCH_INTERVAL_S:
      RECSYS_TRUST_BATCH_RETRY_S:
      LUMEN_EXPLORE_SEAT_SECRET:
      LUMEN_EXPLORE_SEAT_SECRET_PREVIOUS:
      LUMEN_EXPLORE_SEAT_SECRET_ACTIVE_FROM_BUCKET:
      LITE_PUBLISHER_ACCOUNTS:
      LITE_FRONTEND_ACCOUNT_MAINNET:
      LITE_FRONTEND_ACCOUNT_MIRRORNET:
      LITE_FRONTEND_ACCOUNT_TESTNET:
    networks:
      - docker

networks:
  # No `external: true`: the frontend's own root `compose.yml` declares this
  # same network name and every sibling `compose.*.yml` (auth/blog/wallet/
  # caddy/stack) just references `- docker` and relies on that root
  # declaration when included — this file matches that convention so it
  # merges cleanly if included the same way, while still being runnable
  # fully standalone (`docker compose -f deploy/compose.recsys.yml up`
  # creates the network fresh when there is no root file to supply it).
  docker:

