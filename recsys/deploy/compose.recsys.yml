# A10/A7 deploy artifact — recsys serving + trust-batch, in the frontend's
# existing Compose stack shape (`../../frontend/stack/compose.*.yml`:
# `profiles:`, `networks: docker`, a `wget --spider` healthcheck, env vars
# read from the environment rather than hardcoded). Include this file from
# the frontend's own `compose.yml` the same way it already includes
# `compose.auth.yml`/`compose.blog.yml`/etc., or run it standalone with
# `docker compose -f deploy/compose.recsys.yml up`.
#
# Image: build from `../Dockerfile` (`docker build -t recsys:latest ..`ready
# via the `build:` block below) — one image, two roles (see that file's own
# header comment): `recsys-feed` runs it as the continuous HTTP service
# (A10); `recsys-trust-batch` runs the SAME image with its CMD overridden to
# the weekly batch (A7).
#
# 🚩 SCHEDULING THE BATCH IS AN OPERATOR DECISION, DELIBERATELY NOT MADE
# HERE (BUILDMAP-A A7's own "not a Sonnet unit end-to-end" flag). This file
# makes `recsys-trust-batch` a RUNNABLE one-shot service
# (`docker compose run --rm recsys-trust-batch`) but does not wire a
# scheduler — no cron sidecar, no `profiles`-gated always-on loop. Pick one:
#   * host cron -> `docker compose -f deploy/compose.recsys.yml run --rm recsys-trust-batch`
#   * a scheduler container (e.g. `ofelia`) pointed at this same service
#   * a k8s CronJob running this same image with the same CMD override
# if this stack is ever migrated off Compose entirely.

services:
  recsys-feed:
    build:
      context: ..
      dockerfile: Dockerfile
    image: recsys:${RECSYS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Public, read-only HAFSQL mirror (recsys/config.py:HafsqlConfig
      # defaults — override only to point at a different mirror/replica).
      HAFSQL_HOST:
      HAFSQL_PORT:
      HAFSQL_DB:
      HAFSQL_USER:
      HAFSQL_PASSWORD:
      HAFSQL_STATEMENT_TIMEOUT_MS:
      HAFSQL_POOL_MIN:
      HAFSQL_POOL_MAX:
      # recsys's OWN Postgres (A6/A15) — trust snapshots, network suppression.
      # REQUIRED for a real deployment: absent, the service starts (a missing
      # snapshot is a legitimate cold-start state) but /feed refuses every
      # request under FAIL_CLOSED until this is set AND a batch has run.
      RECSYS_DATABASE_URL:
      # Lumen Lite (A13) — off until an operator names the publisher account(s).
      LITE_PUBLISHER_ACCOUNTS:
      LITE_FRONTEND_ACCOUNT_MAINNET:
      LITE_FRONTEND_ACCOUNT_MIRRORNET:
      LITE_FRONTEND_ACCOUNT_TESTNET:
      # ★★ L2 (2026-08-05, round-3 council): the lite ENGAGEMENT datastore —
      # the Lumen app's own Postgres (`LITE_DATABASE_URL` on the frontend
      # side), a THIRD database distinct from the HAFSQL mirror and the recsys
      # DB. Absent, lite votes and reblogs are simply not read: the four
      # publisher vars above were passed and this one was not, so lite POSTS
      # were sourced while lite ENGAGEMENT was silently inert.
      LUMEN_LITE_DATABASE_URL:
      # This service's own tuning (recsys/service/app.py:ServiceConfig).
      # RECSYS_SERVICE_HOST/PORT are the CONTAINER-INTERNAL bind address —
      # deliberately FIXED, never templated from the host-facing port below.
      # (Found running this file: templating both from the same operator
      # variable means changing "which host port to publish on" also changes
      # what the app listens on INSIDE the container, breaking the `ports:`
      # mapping the moment an operator overrides it — reproduced live: the
      # app ended up listening on the host port instead of 8000, and the
      # container:8000 side of the mapping had nothing behind it, so every
      # request got a connection reset. Publish on a different HOST port via
      # `RECSYS_HOST_PORT` instead, below — the container side never moves.)
      RECSYS_SERVICE_HOST: "0.0.0.0"
      RECSYS_SERVICE_PORT: "8000"
      RECSYS_NORM_REFRESH_S:
      RECSYS_SNAPSHOT_REFRESH_S:
      RECSYS_VIEWER_CACHE_TTL_S:
      RECSYS_LOG_LEVEL:
      # ★★★ REQUIRED — WITHOUT THIS THE CONTAINER CRASH-LOOPS (fixed 2026-08-05).
      # `main()` calls `Settings.from_env(production=True)` unless
      # RECSYS_PRODUCTION=0, and that REFUSES to start with no seat secret. This
      # file previously did not mention the variable at all, so the shipped
      # artifact could not boot under `restart: unless-stopped` — reproduced by
      # running it. The blank value is a PASS-THROUGH from the operator's
      # environment/.env; it is deliberately not defaulted, because a default
      # would silently reinstate the publicly-known dev key in production.
      #
      # Generate one: `python -c "import secrets; print(secrets.token_hex(32))"`
      # (64 hex chars = 32 bytes).
      #
      # The seat MAC stops offline NAME GRINDING of the reserved new-author
      # slot — unkeyed, 6 ground names took 85% of that seat platform-wide.
      LUMEN_EXPLORE_SEAT_SECRET:
      # Optional rollover pair. Set PREVIOUS to the outgoing secret and
      # ACTIVE_FROM_BUCKET to a FUTURE bucket so in-flight pages do not reroll
      # mid-rotation; see ExplorationConfig.from_env for the contract.
      LUMEN_EXPLORE_SEAT_SECRET_PREVIOUS:
      LUMEN_EXPLORE_SEAT_SECRET_ACTIVE_FROM_BUCKET:
      # ★★★ ALSO REQUIRED IN PRODUCTION (B4c, 2026-08-05). /feed returns any
      # account's ranked feed plus the full score decomposition, in front of a
      # pool pointed at a SHARED third-party mirror — an open instance is both a
      # data-exposure and an abuse-amplification problem for someone else's
      # database. `main()` refuses to start without this unless
      # RECSYS_PRODUCTION=0. Generate:
      # `python -c "import secrets; print(secrets.token_urlsafe(32))"`
      # Callers send it as `Authorization: Bearer <token>`. /health stays open
      # so container healthchecks and load balancers keep working.
      RECSYS_API_TOKEN:
      # Optional throttles; these have working defaults (120/min, 16 in flight,
      # 10s read timeout) and are listed so an operator can find them.
      # ★★★ ROUND-5 COUNCIL (Seat 1). `RECSYS_TRUSTED_PROXY_HOPS` existed in
      # `ServiceConfig` and reached NO container — the identical defect the
      # round-4 council found for `LUMEN_LITE_DATABASE_URL`, repeated one round
      # later by the same author. Config that exists in code and not in the
      # artifact is config that does not exist.
      #
      # Unset/0 = no proxy in front, `X-Forwarded-For` IGNORED (the safe
      # default). Set it to the number of proxies YOU run: behind the reverse
      # proxy this stack documents, leaving it unset means one unauthenticated
      # client spends the shared rate-limit bucket and 429s every real user.
      RECSYS_TRUSTED_PROXY_HOPS:
      RECSYS_RATE_LIMIT_PER_MINUTE:
      RECSYS_MAX_CONCURRENT_REQUESTS:
      RECSYS_REQUEST_READ_TIMEOUT_S:
      # Bounds how long `borrow()` waits for a pool slot before returning 503
      # instead of opening an unbounded connection (B4b).
      HAFSQL_POOL_ACQUIRE_TIMEOUT_S:
      # `0` opts out of the production fail-shut for LOCAL runs only. Unset
      # means production, which is the safe default and what this file assumes.
      RECSYS_PRODUCTION:
    # ★★★ ROUND-5 COUNCIL (Seat 1) — WITHOUT THIS, A COLD DEPLOY IS UNHEALTHY
    # FOREVER. `/feed` refuses to serve without a trust snapshot, the probe
    # gates on `serving`, and the batch below was documented as "an operator
    # decision" and left unscheduled — so `up` produced a container that could
    # never pass its own healthcheck. Renaming the health JSON's reason (which
    # is what the punch list first did) did not change that by one bit.
    #
    # The batch now runs to completion BEFORE the service starts, so a fresh
    # install comes up serving. It stays a one-shot: this is the FIRST snapshot,
    # not a schedule. Recurring runs are still the operator's to wire (see the
    # header) — but "it never works until you read the docs" is not a deploy.
    depends_on:
      recsys-trust-batch:
        condition: service_completed_successfully
    ports:
      - "${RECSYS_HOST_PORT:-8000}:8000"
    networks:
      - docker
    # ★★ 2026-08-05 POST-CLOSEOUT COUNCIL. Was `wget --spider`, which (a) is not
    # in the `python:3.11-slim` image at all, (b) sends HEAD to a GET-only
    # handler, and (c) read only the status line, so it reported HEALTHY during
    # a total serving outage — `/health` returns 200 by design even when it
    # cannot serve. The probe now reads `serving` from the body. Full autopsy in
    # `recsys/service/healthcheck.py`. Keep this in step with the Dockerfile's
    # own HEALTHCHECK: two probes that disagree are worse than one.
    healthcheck:
      test: ["CMD", "python3", "-m", "recsys.service.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Measured ~232s for NormContext warm-up against the real mirror, so the
      # old 60s could not be met by an honest cold start.
      start_period: 300s

  # One-shot: `docker compose -f deploy/compose.recsys.yml run --rm recsys-trust-batch`.
  # Never started by `up` on its own — no `restart:` policy, and deliberately
  # not part of the default service set an operator gets by running `up` with
  # no arguments (Compose still starts it under plain `up` unless a profile
  # gates it out; add `profiles: ["batch"]` here if the stack this joins
  # already uses profiles the way `frontend/stack/*.yml` does, and gate
  # accordingly — left unset here so this file works standalone too).
  recsys-trust-batch:
    build:
      context: ..
      dockerfile: Dockerfile
    image: recsys:${RECSYS_IMAGE_TAG:-latest}
    command: ["python", "-m", "recsys.jobs.trust_batch"]
    environment:
      HAFSQL_HOST:
      HAFSQL_PORT:
      HAFSQL_DB:
      HAFSQL_USER:
      HAFSQL_PASSWORD:
      RECSYS_DATABASE_URL:
      RECSYS_LOG_LEVEL:
      # ★ REQUIRED for the same reason as the service above: `trust_batch`'s
      # own entry point calls `Settings.from_env(production=not args.dry_run)`,
      # so a real (non-dry-run) batch dies on an uncaught ValueError without
      # this. Found 2026-08-05 running the shipped artifact.
      LUMEN_EXPLORE_SEAT_SECRET:
      LUMEN_EXPLORE_SEAT_SECRET_PREVIOUS:
      LUMEN_EXPLORE_SEAT_SECRET_ACTIVE_FROM_BUCKET:
      # ★★★ REQUIRED FOR L1 (2026-08-05, round-3 council). `run_batch` is the
      # ONLY production caller of `engagement_edges`, so these four decide
      # whether a lite writer accrues their own graph-cred or donates it to the
      # shared publisher account. Passed to the SERVICE and not to the BATCH,
      # they would do nothing at all — the trust graph is built here.
      LITE_PUBLISHER_ACCOUNTS:
      LITE_FRONTEND_ACCOUNT_MAINNET:
      LITE_FRONTEND_ACCOUNT_MIRRORNET:
      LITE_FRONTEND_ACCOUNT_TESTNET:
    networks:
      - docker

networks:
  # No `external: true`: the frontend's own root `compose.yml` declares this
  # same network name and every sibling `compose.*.yml` (auth/blog/wallet/
  # caddy/stack) just references `- docker` and relies on that root
  # declaration when included — this file matches that convention so it
  # merges cleanly if included the same way, while still being runnable
  # fully standalone (`docker compose -f deploy/compose.recsys.yml up`
  # creates the network fresh when there is no root file to supply it).
  docker:

