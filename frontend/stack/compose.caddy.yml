services:  
  caddy:
    profiles:
      - denser
    image: caddy:2.7.6
    init: true
    environment:
      PUBLIC_HOSTNAME:
      AUTH_PORT:
      BLOG_PORT:
      API_HTTP_PORT:
      API_HTTPS_PORT:
    volumes:
       - ./Caddyfile:/etc/caddy/Caddyfile
       - ./certs:/etc/caddy/certs:ro
    networks:
      - docker
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
      - '${BLOG_PORT}:${BLOG_PORT}'
      # WALLET_PORT removed 2026-08-23: apps/wallet was deleted in 56cfc9e, the
      # Caddyfile has no wallet vhost, and nothing listens on it — so this published
      # 4000 on the host and routed it nowhere. It was also the third V18 defect: with
      # WALLET_PORT unset the mapping degenerates to a bare ':' and the file stops parsing.
      - '${API_HTTP_PORT}:${API_HTTP_PORT}'
      - '${API_HTTPS_PORT}:${API_HTTPS_PORT}'
    extra_hosts:
      - "${PUBLIC_HOSTNAME}:127.0.0.1"
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider https://$${PUBLIC_HOSTNAME}:$${AUTH_PORT}/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      denser-auth:
        condition: service_healthy
      denser-blog:
        condition: service_healthy
      # An orphaned second `condition:` sat here until 2026-08-23 — the leftover of a
      # `denser-wallet:` key removed when apps/wallet was deleted (56cfc9e). Two
      # conditions under one service is invalid YAML, so this file could not parse. It
      # went unnoticed because stack/compose.yml failed earlier still, on an include of
      # a compose.wallet.yml that does not exist.