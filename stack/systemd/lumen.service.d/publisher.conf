# Any start or restart of lumen.service pulls the publisher up with it.
# Paired with PartOf=lumen.service in lumen-publisher.service, which takes it
# down again on stop. Added 2026-09-05 after the publisher sat dead for 6 days
# because Requires= propagated the stop and nothing propagated the start.
[Unit]
Wants=lumen-publisher.service
